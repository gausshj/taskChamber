name: Publish release to PyPI

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.11

      - name: Verify release source and version
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          package_version="$(uv version --short)"
          test "$GITHUB_REF_NAME" = "v${package_version}"

      - name: Install the locked development environment
        run: uv sync --locked --all-groups

      # After the locked sync, uv run uses --no-sync so checks can neither
      # re-resolve nor rebuild the project.
      - name: Run repository checks
        run: uv run --no-sync pre-commit run --all-files --show-diff-on-failure

      - name: Run tests
        run: uv run --no-sync pytest -q

      # Deliberate distribution build inside the release trust boundary.
      # Isolated PEP 517 build requirements are pinned and hash-verified
      # through the repository-tracked build-constraints.txt.
      - name: Build wheel and source distribution
        run: >-
          uv build --no-sources
          --build-constraints build-constraints.txt
          --require-hashes

      - name: Audit distribution contents and metadata
        run: uv run --no-sync python scripts/check_distribution.py dist

      # Deliberate installation verification of the just-built wheel.
      - name: Test repeatable uv tool installation
        run: uv run --no-sync python scripts/test_uv_tool_install.py dist/*.whl

      - name: Upload verified distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish distributions
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/taskchamber
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
